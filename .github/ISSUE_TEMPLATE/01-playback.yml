name: "Playback problem"
description: A video won't start, stutters, has no sound, or the subtitles are wrong
labels: ["bug", "playback"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you were playing (a film, a show, a live channel) and what went wrong.
    validations:
      required: true
  - type: dropdown
    id: player
    attributes:
      label: Player
      description: Shown as Playback Backend in Settings.
      multiple: true
      options:
        - ExoPlayer (the default)
        - MPV
        - An external app
    validations:
      required: true
  - type: textarea
    id: mediainfo
    attributes:
      label: About the file
      description: Container, video and audio codecs, and whether Jellyfin was transcoding. Hold OK on the film or episode and choose "Send media info log to server" to collect this.
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: Tally version
      description: At the bottom of Settings.
      placeholder: "v1.0.8-156-gd202ea17"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Jellyfin server version
      placeholder: "10.10.7"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: TV or streaming box
      placeholder: "Chromecast with Google TV, Fire TV Stick 4K, Nvidia Shield..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In Tally, Settings → Advanced Settings → Send app logs to current server. Whoever runs the server finds them in the Jellyfin dashboard under Logs. Check them for anything private before pasting.
      render: text
    validations:
      required: false
