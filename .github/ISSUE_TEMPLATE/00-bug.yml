name: "Something's wrong"
description: A screen looks off, a button does the wrong thing, the app crashed
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. A photo of the TV is often the fastest way to show it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open Sports
        2. Press right twice on the first row
        3. ...
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: Tally version
      description: At the bottom of Settings.
      placeholder: "v1.0.8-156-gd202ea17"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Jellyfin server version
      placeholder: "10.10.7"
    validations:
      required: false
  - type: dropdown
    id: plugin
    attributes:
      label: Is the Tally server plugin installed?
      options:
        - "Yes"
        - "No"
        - "I don't know"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV or streaming box
      placeholder: "Chromecast with Google TV, Fire TV Stick 4K, Nvidia Shield..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In Tally, Settings → Advanced Settings → Send app logs to current server. Whoever runs the server finds them in the Jellyfin dashboard under Logs. Check them for anything private before pasting.
      render: text
    validations:
      required: false
